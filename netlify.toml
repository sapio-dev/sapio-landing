[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# http://www iba al dominio raiz en DOS saltos: primero a https://www y de ahi
# al apex. Esta regla se salta el intermedio. Va ANTES que el resto porque
# Netlify aplica la primera que calza.
[[redirects]]
  from = "http://www.sapio.dev/*"
  to = "https://sapio.dev/:splat"
  status = 301
  force = true

# Servir landing.html como root
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

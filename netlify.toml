# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Archivos internos del rediseño (contexto de producto, sistema de diseño, fuentes de la
# portada): nunca se sirven. PRODUCT.md tiene datos de clientes.
[[redirects]]
  from = "/PRODUCT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/servicio/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.impeccable/*"
  to = "/404.html"
  status = 404
  force = true

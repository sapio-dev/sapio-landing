[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# La portada se mudo a gosapio.com. landing.html sigue en el repo y accesible
# en /landing.html; lo que cambia es a donde llega quien escribe sapio.dev.
[[redirects]]
  from = "/"
  to = "https://gosapio.com/"
  status = 301
  force = true

# El blog y el centro de ayuda se mudaron a gosapio.com, que quedo como
# canonico (2026-09-02). Van con force porque los archivos siguen en el repo:
# sin force, Netlify sirve el estatico y la redireccion nunca corre.
[[redirects]]
  from = "/blog/*"
  to = "https://gosapio.com/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/help-center/*"
  to = "https://gosapio.com/help-center/:splat"
  status = 301
  force = true

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# NO intentar colapsar el doble salto de http://www con una regla aca: Netlify
# hace el upgrade a HTTPS en el mismo host ANTES de correr el motor de
# redirecciones, asi que una regla con `from = "http://www..."` nunca se
# alcanza. Probado el 2026-09-02: la regla se desplego y la cadena siguio
# siendo http://www -> https://www -> apex. Es de la plataforma.

# /conversations e /insights son paginas de la era Sense: marca violeta, un
# producto que ya no existe. Search Console (3 meses) muestra que solo salen
# por consultas de MARCA —"sapio"—, no por termino de producto, asi que el
# clic que traen aterriza en una version vieja de la empresa. Se consolidan en
# la portada, que es la que ya rankea para la marca.
# force porque los .html siguen en el repo y Netlify los serviria.
[[redirects]]
  from = "/conversations"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/insights"
  to = "/"
  status = 301
  force = true

# Los mismos archivos pedidos con extension, y dos borradores que quedaron en el
# repo y respondian 200: landing-full (la version vieja de la portada) y un
# preview de hero sin canonical ni noindex.
[[redirects]]
  from = "/conversations.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/insights.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/landing-full.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/insights-hero-preview.html"
  to = "/"
  status = 301
  force = true

# 2026-10-08: las landings nuevas. Clínicas y Ecommerce pasan a Salud y Retail (páginas más amplias que
# mantienen esos términos en el título). force porque clinicas.html y ecommerce.html siguen en el repo.
[[redirects]]
  from = "/clinicas"
  to = "/industrias/clinicas/"
  status = 301
  force = true

[[redirects]]
  from = "/clinicas.html"
  to = "/industrias/clinicas/"
  status = 301
  force = true

[[redirects]]
  from = "/ecommerce"
  to = "/industrias/retail-y-ecommerce/"
  status = 301
  force = true

[[redirects]]
  from = "/ecommerce.html"
  to = "/industrias/retail-y-ecommerce/"
  status = 301
  force = true


# 2026-11-02: el sitio nuevo pasa a ser sapio.dev. Cada página del sitio anterior lleva a su par en el
